<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .response {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
            color: #333;
        }
        
        .response.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Willkommen!</h1>
        <p>Dies ist dein Express Server auf Port 3000</p>
        
        <div class="button-group">
            <button onclick="fetchHello()">API aufrufen</button>
            <button onclick="clearResponse()">Löschen</button>
        </div>
        
        <div class="response" id="response"></div>
    </div>
    
    <script>
        async function fetchHello() {
            try {
                const response = await fetch('/api/hello');
                const data = await response.json();
                displayResponse(data.message);
            } catch (error) {
                displayResponse('Fehler: ' + error.message);
            }
        }
        
        function displayResponse(message) {
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = message;
            responseDiv.classList.add('active');
        }
        
        function clearResponse() {
            document.getElementById('response').classList.remove('active');
        }
    </script>
</body>
</html>
