<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Echo Chat</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    margin:0;
}

#messages{
    height:80vh;
    overflow:auto;
    padding:20px;
}

.msg{
    background:#222;
    padding:10px;
    margin-bottom:10px;
    border-radius:10px;
}

.admin{
    color:gold;
    font-weight:bold;
}

#bar{
    display:flex;
    padding:10px;
    background:#1a1a1a;
}

input{
    flex:1;
    padding:10px;
}

button{
    padding:10px;
}
</style>
</head>

<body>

<div id="messages"></div>

<div id="bar">
    <input id="msg">
    <button onclick="send()">Send</button>
</div>

<script>
let myName = prompt("Name eingeben");

if(myName === "*DUCK*"){
    alert("Admin aktiviert");
}

const API = "";

const messages = document.getElementById("messages");

async function load(){
    const res = await fetch("/messages");
    const data = await res.json();

    messages.innerHTML = "";

    data.forEach(addMsg);
}

function addMsg(msg){

    const div = document.createElement("div");
    div.className = "msg";

    div.innerHTML = `
        <div>
            <span class="${msg.admin ? 'admin' : ''}">
                ${msg.name}
            </span>
            ${msg.admin ? '👑 ADMIN' : ''}
        </div>

        <div>${msg.text}</div>
    `;

    messages.appendChild(div);
}

async function send(){

    const text = document.getElementById("msg").value;

    await fetch("/send",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            name:myName,
            text
        })
    });

    document.getElementById("msg").value = "";
}

const es = new EventSource("/stream");

es.onmessage = e => {
    const data = JSON.parse(e.data);

    if(data.type === "msg"){
        addMsg(data);
    }
};

load();
</script>

</body>
</html>
